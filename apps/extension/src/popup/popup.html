<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lemma</title>
    <style>
      :root {
        --paper: #fdfcfa;
        --ink: #1a1a17;
        --ink-soft: #57544c;
        --ink-faint: #8a867b;
        --line: #e8e4db;
        --accent: #2d5f4c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 380px;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.5 system-ui, sans-serif;
      }
      .wrap { padding: 16px; }
      .brand { font-family: Newsreader, Georgia, serif; font-style: italic; color: var(--ink-faint); font-size: 13px; }
      h1.word {
        font-family: Newsreader, Georgia, serif;
        font-size: 26px;
        margin: 8px 0 2px;
        font-weight: 500;
      }
      input.word-edit {
        font-family: Newsreader, Georgia, serif;
        font-size: 24px;
        width: 100%;
        border: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 2px 0;
        margin: 6px 0 2px;
        outline: none;
      }
      input.word-edit:focus { border-color: var(--accent); }
      .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
      .sentence { color: var(--ink-faint); font-size: 12.5px; margin: 8px 0 14px; }
      label.field-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 4px; }
      textarea.note {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid var(--line);
        border-left: 2px solid var(--accent);
        border-radius: 0 6px 6px 0;
        padding: 8px 10px;
        font: 14px/1.55 system-ui, sans-serif;
        background: #fff;
        outline: none;
      }
      textarea.note:focus { border-color: var(--accent); }
      .ref-block { margin: 10px 0 0; }
      .ref-block .field-label { margin-bottom: 2px; }
      .ref-block p { margin: 0; }
      .ref-def { font-size: 13.5px; line-height: 1.5; color: var(--ink); }
      .ref-wiki { font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
      .explanation { font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); }
      .opt { text-transform: none; letter-spacing: 0; }
      .space-select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: 13px system-ui, sans-serif; color: var(--ink); }
      #note { margin-top: 0; }
      #ref + label { margin-top: 14px; }
      details.dict { font-size: 12.5px; color: var(--ink-faint); margin-top: 6px; }
      details.dict summary { cursor: pointer; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
      button.primary {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      button.link { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 12.5px; }
      .status { font-size: 12.5px; color: var(--accent); }
      .status.error { color: #b4443c; }
      .muted { color: var(--ink-faint); font-size: 12.5px; }
      img.screenshot-preview {
        display: block;
        width: 100%;
        max-height: 180px;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        margin: 8px 0 12px;
      }
      [hidden] { display: none !important; }
      #connect-view { text-align: center; padding: 28px 8px; }
      #connect-view p { color: var(--ink-soft); }
      /* first-run onboarding: three short slides, system fonts only */
      .ob-dots { display: flex; gap: 5px; margin: 6px 0 14px; }
      .ob-dots i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background-color 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
      .ob-dots i.on { background: var(--accent); }
      .ob-slide { animation: ob-rise 0.5s cubic-bezier(0.34, 1.42, 0.5, 1) backwards; }
      .ob-slide h2 { font: 600 17px/1.3 system-ui, sans-serif; margin: 0 0 6px; }
      .ob-slide p { margin: 0; color: var(--ink-soft); }
      @keyframes ob-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Lemma</div>

      <section id="onboard-view" hidden>
        <div class="ob-dots" id="ob-dots"></div>
        <div class="ob-slide" id="ob-slide">
          <h2 id="ob-title"></h2>
          <p id="ob-body"></p>
        </div>
        <div class="row">
          <button class="primary" id="ob-next">Next</button>
          <button class="link" id="ob-skip">Skip</button>
        </div>
      </section>

      <section id="connect-view" hidden>
        <p>Connect your account to start saving words.</p>
        <div class="row" style="justify-content: center">
          <button class="primary" id="connect-btn">Connect account</button>
        </div>
      </section>

      <section id="capture-view" hidden>
        <img class="screenshot-preview" id="screenshotPreview" hidden />
        <input class="word-edit" id="word" spellcheck="false" />
        <div class="kind" id="kind">word</div>
        <div class="sentence" id="sentence"></div>
        <div class="sentence" id="linkUrlDisplay" hidden></div>

        <div id="ref" hidden>
          <div class="ref-block" id="def-block" hidden>
            <div class="field-label">Definition</div>
            <p class="ref-def" id="def-text"></p>
          </div>
          <div class="ref-block" id="wiki-block" hidden>
            <div class="field-label">From Wikipedia</div>
            <p class="ref-wiki" id="wiki-text"></p>
          </div>
          <div class="ref-block">
            <div class="field-label">How it&rsquo;s used here</div>
            <p class="explanation" id="explanation">Looking up…</p>
          </div>
        </div>

        <label class="field-label" for="note">Your note <span class="opt">(optional)</span></label>
        <textarea class="note" id="note" placeholder="Why did this matter to you?"></textarea>

        <label class="field-label" for="space" style="margin-top: 12px">Save to</label>
        <select id="space" class="space-select"><option value="">My vault</option></select>

        <div class="row">
          <button class="primary" id="save-btn">Save</button>
          <span class="status" id="status"></span>
        </div>
        <div class="row">
          <span class="muted" id="account"></span>
          <button class="link" id="signout-btn">Sign out</button>
        </div>
      </section>

      <section id="empty-view" hidden>
        <p class="muted">
          Highlight a word or right-click anywhere &rarr; &ldquo;Save to Lemma&rdquo; to capture a
          screenshot, a link, or (Ctrl+Shift+S) the current selection.
        </p>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
